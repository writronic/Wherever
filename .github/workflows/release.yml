name: Release

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out the release commit
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Select Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version | grep -qx 'Build version 27A266a'

      - name: Install the build tools
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm install --global create-dmg@8.1.0 --allow-scripts=fs-xattr,macos-alias
          for pin in CFPropertyList:2.3.6 rexml:3.4.2 atomos:0.1.3 claide:1.1.0 colored2:3.1.2 nanaimo:0.4.0 xcodeproj:1.27.0; do
            /usr/bin/gem install --user-install --no-document --conservative "${pin%%:*}" -v "${pin##*:}"
          done

      - name: Import the signing keychain
        env:
          DEV_ID_P12_BASE64: ${{ secrets.DEV_ID_P12_BASE64 }}
          DEV_ID_P12_PASSWORD: ${{ secrets.DEV_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KCPW="$(uuidgen)"
          printf '%s' "$DEV_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$DEV_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC"
          xcrun notarytool store-credentials Wherever --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/"Developer ID Application: / { print $2; exit }')"
          test -n "$IDENTITY"
          echo "WHEREVER_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "WHEREVER_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          WHEREVER_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WHEREVER_RELEASE_BUILD: ${{ runner.temp }}/release-build
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then set -- --tag "$TAG"; fi
          /bin/sh scripts/build.sh --keychain "$WHEREVER_KEYCHAIN" --output "$RUNNER_TEMP/out" "$@"

      - name: Upload the release files
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          OUT="$RUNNER_TEMP/out"
          gh release upload "$TAG" "$OUT/Wherever.dmg" --repo "$GITHUB_REPOSITORY"
          mkdir "$RUNNER_TEMP/check"
          gh release download "$TAG" --pattern "Wherever.dmg" --dir "$RUNNER_TEMP/check" --repo "$GITHUB_REPOSITORY"
          test "$(shasum -a 256 < "$RUNNER_TEMP/check/Wherever.dmg")" = "$(shasum -a 256 < "$OUT/Wherever.dmg")"

      - name: Commit the appcast
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/appcast.xml?ref=main" --jq .sha)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/appcast.xml" --silent \
            -f message="Update the appcast for $TAG" -f branch=main -f sha="$SHA" \
            -f content="$(base64 -i "$RUNNER_TEMP/out/appcast.xml")"

      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/devid.p12"
